<svg width="140" height="95" viewBox="0 0 140 95" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Desk Base Line -->
  <line x1="10" y1="90" x2="130" y2="90" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Developer Head / Hair behind laptop -->
  <path d="M58 35 C58 20, 64 12, 70 12 C76 12, 82 20, 82 35" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5"/>
  <path d="M56 22 C62 16, 78 16, 84 22" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Glasses / Eyes peering over -->
  <circle cx="65" cy="28" r="4" stroke="#1A1A1A" stroke-width="1.8"/>
  <circle cx="75" cy="28" r="4" stroke="#1A1A1A" stroke-width="1.8"/>
  <line x1="69" y1="28" x2="71" y2="28" stroke="#1A1A1A" stroke-width="1.8"/>

  <!-- Hands on Keyboard -->
  <ellipse cx="44" cy="78" rx="7" ry="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <ellipse cx="96" cy="78" rx="7" ry="4" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Laptop Open Lid -->
  <polygon points="45,42 95,42 90,82 50,82" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Glowing GrownowW 'W' Logo on Laptop Lid -->
  <circle cx="70" cy="60" r="11" fill="#FFFDF0" stroke="#FAA300" stroke-width="1.5"/>
  <path d="M64 56 L67 65 L70 58 L73 65 L76 56" stroke="#FAA300" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Laptop Base on Desk -->
  <path d="M38 82 L102 82 L105 88 L35 88 Z" fill="#F1F5F9" stroke="#1A1A1A" stroke-width="2"/>

  <!-- Coffee Mug with GrownowW Accent on Left -->
  <rect x="22" y="65" width="12" height="18" rx="2" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="2"/>
  <path d="M22 69 C18 69, 18 78, 22 78" stroke="#1A1A1A" stroke-width="1.8"/>
  <line x1="25" y1="74" x2="31" y2="74" stroke="#FAA300" stroke-width="2"/>
  <!-- Steam -->
  <path d="M28 60 C26 56, 30 52, 28 48" stroke="#D4AF37" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 2"/>
</svg>
