<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9900" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg1)" rx="24"/>
  <circle cx="700" cy="150" r="220" fill="url(#gold)" opacity="0.18" filter="url(#glow1)"/>
  <circle cx="100" cy="850" r="260" fill="url(#cyan)" opacity="0.15" filter="url(#glow1)"/>
  
  <!-- Grid Lines Overlay -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="1000"/>
    <line x1="720" y1="0" x2="720" y2="1000"/>
    <line x1="0" y1="120" x2="800" y2="120"/>
    <line x1="0" y1="880" x2="800" y2="880"/>
  </g>

  <!-- Header Badge -->
  <rect x="80" y="70" width="180" height="34" rx="17" fill="rgba(255,102,0,0.15)" stroke="#ff6600" stroke-width="1.5"/>
  <text x="170" y="93" fill="#ff9900" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">BRAND IDENTITY</text>
  <text x="720" y="93" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="end">GROWNOWW STUDIO</text>

  <!-- Central Visual Showcase -->
  <g transform="translate(160, 200)">
    <!-- Geometric 3D Abstract Cube / Brand Emblem -->
    <rect x="60" y="60" width="360" height="360" rx="32" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <polygon points="240,110 380,190 380,350 240,430 100,350 100,190" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <polygon points="240,110 240,270 380,190" fill="url(#gold)" opacity="0.4"/>
    <polygon points="240,270 240,430 100,350" fill="url(#gold)" opacity="0.7"/>
    <polygon points="240,270 380,350 240,430" fill="url(#gold)" opacity="0.9"/>
    <circle cx="240" cy="270" r="16" fill="#fff"/>
  </g>

  <!-- Typography & Story -->
  <text x="80" y="700" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">LUXE AESTHETICS</text>
  <text x="80" y="750" fill="#ff9900" font-family="'Outfit', 'Inter', sans-serif" font-size="32" font-weight="700">Visual System &amp; Brand Guidelines</text>
  <text x="80" y="805" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17" line-height="1.6" width="640">
    <tspan x="80" dy="0">Crafted distinctive typography, premium palettes, and iconic brand assets</tspan>
    <tspan x="80" dy="26">engineered to build immediate authority and memorable market presence.</tspan>
  </text>

  <!-- Bottom Details -->
  <line x1="80" y1="915" x2="720" y2="915" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="80" y="955" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="14" font-weight="600">DELIVERABLES: LOGO • GUIDELINES • PACKAGING</text>
  <text x="720" y="955" fill="#ff6600" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="end">GROWNOWW CREATIVE →</text>
</svg>