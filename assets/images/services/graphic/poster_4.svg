<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="60%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="orangeFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg4)" rx="24"/>
  <circle cx="650" cy="250" r="230" fill="url(#orangeFire)" opacity="0.25"/>

  <!-- Header Badge -->
  <rect x="80" y="70" width="190" height="34" rx="17" fill="rgba(249,115,22,0.15)" stroke="#f97316" stroke-width="1.5"/>
  <text x="175" y="93" fill="#fb923c" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">SOCIAL CREATIVES</text>
  <text x="720" y="93" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="end">VIRAL CAMPAIGNS</text>

  <!-- Social Creative Collage Showcase -->
  <g transform="translate(180, 170)">
    <!-- Back card -->
    <rect x="140" y="30" width="260" height="340" rx="20" fill="#292524" transform="rotate(12, 270, 200)" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
    <!-- Front card -->
    <rect x="20" y="40" width="280" height="370" rx="24" fill="url(#orangeFire)" stroke="#ffffff" stroke-width="3"/>
    <circle cx="80" cy="100" r="30" fill="#ffffff"/>
    <text x="80" y="108" fill="#f97316" font-family="'Outfit', sans-serif" font-size="28" font-weight="900" text-anchor="middle">⚡</text>
    <text x="130" y="95" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="26" font-weight="900">BOOST SALES</text>
    <text x="130" y="120" fill="#fed7aa" font-family="'Inter', sans-serif" font-size="15" font-weight="600">300% ROI CAMPAIGN</text>

    <rect x="50" y="160" width="220" height="150" rx="16" fill="rgba(0,0,0,0.25)"/>
    <text x="160" y="225" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="36" font-weight="900" text-anchor="middle">BIG LAUNCH</text>
    <rect x="70" y="250" width="180" height="40" rx="20" fill="#ffffff"/>
    <text x="160" y="276" fill="#ea580c" font-family="'Inter', sans-serif" font-size="15" font-weight="800" text-anchor="middle">SHOP NOW →</text>
  </g>

  <!-- Typography & Story -->
  <text x="80" y="720" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="50" font-weight="900" letter-spacing="-1">SOCIAL AD SYSTEM</text>
  <text x="80" y="768" fill="#fb923c" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700">High-Performance Ad Creatives</text>
  <text x="80" y="820" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">
    <tspan x="80" dy="0">High-converting Meta &amp; LinkedIn carousel posts, dynamic stories,</tspan>
    <tspan x="80" dy="26">and conversion-focused display marketing assets.</tspan>
  </text>

  <!-- Bottom Details -->
  <line x1="80" y1="915" x2="720" y2="915" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="80" y="955" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="14" font-weight="600">DELIVERABLES: INSTAGRAM • ADS • CAROUSELS</text>
  <text x="720" y="955" fill="#fb923c" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="end">VIEW ADS →</text>
</svg>