<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg2)" rx="24"/>
  <circle cx="650" cy="300" r="200" fill="url(#emerald)" opacity="0.2"/>

  <!-- Header Badge -->
  <rect x="80" y="70" width="170" height="34" rx="17" fill="rgba(16,185,129,0.15)" stroke="#10b981" stroke-width="1.5"/>
  <text x="165" y="93" fill="#34d399" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">UI / UX DESIGN</text>
  <text x="720" y="93" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="end">DIGITAL INTERACTION</text>

  <!-- Modern App Phone Mockup Art -->
  <g transform="translate(240, 170)">
    <rect x="0" y="0" width="320" height="480" rx="40" fill="#1e293b" stroke="url(#neon)" stroke-width="4"/>
    <rect x="110" y="14" width="100" height="18" rx="9" fill="#0f172a"/>
    <!-- Screen elements -->
    <rect x="25" y="60" width="270" height="90" rx="18" fill="url(#emerald)"/>
    <text x="45" y="100" fill="#ffffff" font-family="'Inter', sans-serif" font-size="14" font-weight="600">Total Portfolio Value</text>
    <text x="45" y="130" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="800">$128,450.00</text>
    
    <!-- Chart lines -->
    <path d="M 25 240 Q 90 190, 160 220 T 295 180" fill="none" stroke="#34d399" stroke-width="4"/>
    <rect x="25" y="270" width="125" height="70" rx="14" fill="#334155"/>
    <rect x="170" y="270" width="125" height="70" rx="14" fill="#334155"/>
    <rect x="25" y="360" width="270" height="60" rx="16" fill="url(#neon)"/>
    <text x="160" y="396" fill="#0f172a" font-family="'Inter', sans-serif" font-size="16" font-weight="800" text-anchor="middle">TRANSFER FUNDS</text>
  </g>

  <!-- Typography & Story -->
  <text x="80" y="720" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="50" font-weight="900" letter-spacing="-1">NEO FINTECH APP</text>
  <text x="80" y="768" fill="#34d399" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700">Next-Gen Interface Experience</text>
  <text x="80" y="820" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">
    <tspan x="80" dy="0">High-converting mobile UI with frictionless micro-interactions,</tspan>
    <tspan x="80" dy="26">accessible dark mode, and biometric authentication design.</tspan>
  </text>

  <!-- Bottom Details -->
  <line x1="80" y1="915" x2="720" y2="915" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="80" y="955" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="14" font-weight="600">DELIVERABLES: WIREFRAMING • PROTOTYPING • DESIGN SYSTEM</text>
  <text x="720" y="955" fill="#34d399" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="end">EXPLORE UI →</text>
</svg>