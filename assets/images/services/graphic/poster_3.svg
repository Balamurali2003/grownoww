<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
  </defs>
  <rect width="800" height="1000" fill="url(#bg3)" rx="24"/>
  <circle cx="200" cy="300" r="220" fill="url(#purpleGlow)" opacity="0.2"/>

  <!-- Header Badge -->
  <rect x="80" y="70" width="200" height="34" rx="17" fill="rgba(168,85,247,0.15)" stroke="#a855f7" stroke-width="1.5"/>
  <text x="180" y="93" fill="#c084fc" font-family="'Inter', sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">PACKAGING &amp; 3D</text>
  <text x="720" y="93" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="end">GROWNOWW 3D</text>

  <!-- 3D Packaging Bottle & Box Illustration -->
  <g transform="translate(250, 180)">
    <!-- Box -->
    <polygon points="80,100 180,50 280,100 180,150" fill="#a855f7" opacity="0.8"/>
    <polygon points="80,100 180,150 180,380 80,330" fill="#7e22ce"/>
    <polygon points="180,150 280,100 280,330 180,380" fill="#6b21a8"/>
    <text x="130" y="250" fill="#ffffff" font-family="'Inter', sans-serif" font-size="20" font-weight="800" transform="rotate(27, 130, 250)">BOTANIC</text>

    <!-- Luxury Bottle -->
    <rect x="180" y="160" width="130" height="230" rx="20" fill="url(#purpleGlow)" stroke="#ffffff" stroke-width="2"/>
    <rect x="220" y="120" width="50" height="40" rx="6" fill="#facc15"/>
    <rect x="195" y="220" width="100" height="120" rx="10" fill="#ffffff"/>
    <text x="245" y="270" fill="#0f172a" font-family="'Inter', sans-serif" font-size="15" font-weight="800" text-anchor="middle">PURE SERUM</text>
    <text x="245" y="295" fill="#a855f7" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">ORGANIC 50ML</text>
  </g>

  <!-- Typography & Story -->
  <text x="80" y="720" fill="#ffffff" font-family="'Outfit', 'Inter', sans-serif" font-size="50" font-weight="900" letter-spacing="-1">LUXURY PACKAGING</text>
  <text x="80" y="768" fill="#c084fc" font-family="'Outfit', 'Inter', sans-serif" font-size="30" font-weight="700">Product Line &amp; Label Design</text>
  <text x="80" y="820" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="17">
    <tspan x="80" dy="0">Bespoke cosmetic bottle packaging, foil-stamped boxes, and</tspan>
    <tspan x="80" dy="26">sustainable print finishes for high-end retail distribution.</tspan>
  </text>

  <!-- Bottom Details -->
  <line x1="80" y1="915" x2="720" y2="915" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="80" y="955" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="14" font-weight="600">DELIVERABLES: 3D RENDERING • DIE-CUTS • PRINT SPEC</text>
  <text x="720" y="955" fill="#c084fc" font-family="'Inter', sans-serif" font-size="14" font-weight="800" text-anchor="end">VIEW PACKAGING →</text>
</svg>